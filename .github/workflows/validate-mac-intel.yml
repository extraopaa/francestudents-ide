name: Validate existing Mac Intel package
on:
  workflow_dispatch:
    inputs:
      run:
        description: Build run containing the Intel package with identical runtime sources
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  validate:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Retrieve the existing build
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ inputs.run }}
        run: |
          gh run download "$BUILD_RUN" -R "$GITHUB_REPOSITORY" -n FranceStudentIDE-mac-x64 --dir release/intel-build
          source_sha=$(gh run view "$BUILD_RUN" -R "$GITHUB_REPOSITORY" --json headSha --jq .headSha)
          git fetch origin "$source_sha"
          git diff --exit-code "$source_sha" HEAD -- desktop src package.json index.js patches scripts/build-effectcraft.js
          ditto -x -k release/intel-build/*-mac-x64.zip release/intel-app
      - name: Verify signatures including the DMG
        shell: bash
        run: |
          set -euo pipefail
          codesign --verify --deep --strict --verbose=2 'release/intel-app/FranceStudent IDE.app'
          mountpoint=$(mktemp -d)
          trap 'hdiutil detach "$mountpoint" >/dev/null 2>&1 || true; rmdir "$mountpoint" || true' EXIT
          hdiutil attach release/intel-build/*-mac-x64.dmg -mountpoint "$mountpoint" -nobrowse -readonly
          codesign --verify --deep --strict --verbose=2 "$mountpoint/FranceStudent IDE.app"
          codesign --display --verbose=4 "$mountpoint/FranceStudent IDE.app" 2> release/intel-build/signature-mac-x64.txt
          spctl --assess --type execute --verbose=4 "$mountpoint/FranceStudent IDE.app" > release/intel-build/gatekeeper-mac-x64.txt 2>&1 || true
      - name: Exercise the real engine with available CI graphics backends
        env:
          FRST_PACKAGED_EXE: ${{ github.workspace }}/release/intel-app/FranceStudent IDE.app/Contents/MacOS/FranceStudent IDE
          FRST_E2E_SOFTWARE_WEBGL: "1"
          FRST_QA_SCREENSHOT: ${{ github.workspace }}/release/intel-build/qa-mac-x64
        shell: bash
        run: |
          set -o pipefail
          for backend in swiftshader gl metal; do
            if FRST_E2E_ANGLE_BACKEND="$backend" node --test e2e/effectcraft.e2e.test.js 2>&1 | tee "release/intel-build/graphics-$backend.txt"; then
              echo "Validated graphics backend: $backend" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done
          exit 1
      - name: Checksums
        run: shasum -a 256 release/intel-build/*.dmg release/intel-build/*.zip > release/intel-build/SHA256SUMS-mac-x64.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FranceStudentIDE-mac-x64-verified
          path: release/intel-build/*
