name: Build and test macOS
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Source tag or commit to build (empty uses the selected branch)
        required: false
        type: string
  push:
    tags:
      - "v*"
permissions:
  contents: read
jobs:
  build-mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            app: release/mac-arm64/FranceStudent IDE.app
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify native architecture
        run: node -e "if(process.arch!=='${{ matrix.arch }}')process.exit(1)"
      - run: npm install
      - run: npm run prepare:electron
      - run: npm audit --audit-level=low
      - run: npm test
      - name: Prepare isolated test keychain
        shell: bash
        run: |
          set -euo pipefail
          qa_password=$(openssl rand -hex 32)
          echo "::add-mask::$qa_password"
          qa_keychain="$RUNNER_TEMP/frst-validation.keychain-db"
          security create-keychain -p "$qa_password" "$qa_keychain"
          security set-keychain-settings -lut 21600 "$qa_keychain"
          security unlock-keychain -p "$qa_password" "$qa_keychain"
          security list-keychains -d user -s "$qa_keychain" "$HOME/Library/Keychains/login.keychain-db"
          security default-keychain -s "$qa_keychain"
      - name: Test update offers in the Mac interface
        timeout-minutes: 8
        run: npm run build:renderer && node --test --test-concurrency=1 e2e/startup-update-offer.e2e.test.js e2e/ipc-security.e2e.test.js e2e/credential-migration.e2e.test.js
      - uses: ./.github/actions/build-effectcraft
      - name: Build native installers
        id: package
        run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Test packaged application and EffectCraft
        run: node --test e2e/effectcraft.e2e.test.js
        env:
          FRST_PACKAGED_EXE: ${{ github.workspace }}/${{ matrix.app }}/Contents/MacOS/FranceStudent IDE
          FRST_QA_SCREENSHOT: ${{ github.workspace }}/release/qa-mac-${{ matrix.arch }}
      - name: Verify application signature and DMG contents
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        shell: bash
        env:
          MAC_APP: ${{ matrix.app }}
          MAC_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          codesign --verify --deep --strict --verbose=2 "$MAC_APP"
          codesign --display --verbose=4 "$MAC_APP" 2> "release/signature-mac-$MAC_ARCH.txt"
          image=$(find release -maxdepth 1 -name "*-mac-$MAC_ARCH.dmg" -print -quit)
          mountpoint=$(mktemp -d)
          trap 'hdiutil detach "$mountpoint" >/dev/null 2>&1 || true; rmdir "$mountpoint" || true' EXIT
          hdiutil attach "$image" -mountpoint "$mountpoint" -nobrowse -readonly
          codesign --verify --deep --strict --verbose=2 "$mountpoint/FranceStudent IDE.app"
          spctl --assess --type execute --verbose=4 "$mountpoint/FranceStudent IDE.app" > "release/gatekeeper-mac-$MAC_ARCH.txt" 2>&1 || true
      - name: Checksums
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: shasum -a 256 release/*.dmg release/*.zip > release/SHA256SUMS-mac-${{ matrix.arch }}.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FranceStudentIDE-mac-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
            release/SHA256SUMS-mac-*.txt
            release/qa-mac-*.png
            release/signature-mac-*.txt
            release/gatekeeper-mac-*.txt
          if-no-files-found: warn
