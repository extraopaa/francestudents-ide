<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Chat · IDE Link</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/studio.js" defer></script>
  <script src="/render.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="agent-header"><div class="agent-title"><strong>Agent</strong><span class="beta">IDE Link · Bêta</span></div></header>
  <nav class="agent-navigation" aria-label="Espace agent"><div class="agent-tabs" role="tablist" aria-label="Espace agent"><button type="button" class="selected" role="tab" aria-selected="true" aria-controls="messages">Conversation</button></div></nav>
  <div class="agent-context-bar"><span id="status" role="status">Connexion…</span><span class="access-label">Autorisations du PC</span></div>
  <section id="agent-live-plan" class="agent-live-plan" aria-label="Plan de travail" hidden></section>
  <form id="pair-form" class="composer" hidden>
    <div class="composer-box">
      <label for="pair-pin" class="composer-label">Code PIN affiché sur l’ordinateur</label>
      <input id="pair-pin" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required>
      <button type="submit" class="primary">Connecter</button>
      <p class="notice">Le code est temporaire et ne peut être utilisé qu’une fois.</p>
    </div>
  </form>
  <main class="chat-main">
    <section id="messages" class="transcript" aria-label="Conversation" aria-live="polite"></section>
    <section id="interactive-prompts" class="pending-prompts" aria-label="Questions et confirmations"></section>
  </main>
  <form id="form" class="composer" hidden>
    <section id="queued-prompts" class="queued-prompts" aria-label="Demandes en attente" hidden></section>
    <div class="composer-box">
      <label for="prompt" class="visually-hidden">Demande à l’agent</label>
      <textarea id="prompt" maxlength="30000" rows="2" placeholder="Demande à l’agent…" required></textarea>
      <div id="attachment-list" class="attachment-list" aria-live="polite"></div>
      <div class="composer-actions"><label for="attachments" class="attach-btn" title="Joindre des fichiers ou des images">📎 <span>Joindre</span></label><input id="attachments" type="file" multiple class="visually-hidden" aria-label="Pièces jointes (4 fichiers, 2 Mo au total)"><span class="composer-hint">4 fichiers · 2 Mo maximum</span><button type="button" id="stop-task" title="Interrompre la tâche en cours et mettre la file en pause">Stop</button><button type="submit" class="primary">Envoyer</button></div>
    </div>
    <p class="notice">Bêta : les commandes / et les saisies secrètes restent disponibles sur l’ordinateur uniquement.</p>
  </form>
</body>
</html>
